<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/symposiums.html" />
    <link rel="canonical" href="/symposiums.html" />
    <title>Symposiums | Indian Peptide Society</title>
    <script>
      const params = window.location.search;
      const hash = window.location.hash;
      let target = "/symposiums.html";
      const tab = new URLSearchParams(params).get("tab");
      if (tab === "past" || tab === "student" || tab === "upcoming") {
        target = `/symposiums.html#${tab}`;
      } else if (hash) {
        target = `/symposiums.html${hash}`;
      }
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p><a href="/symposiums.html">Continue to Symposiums</a></p>
  </body>
</html>
